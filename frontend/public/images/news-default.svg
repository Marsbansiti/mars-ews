<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_def" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#181c2b"/>
      <stop offset="100%" stop-color="#271b26"/>
    </linearGradient>
    <linearGradient id="rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg_def)"/>

  <!-- Newspaper / Editorial Layout Silhouette -->
  <g transform="translate(600, 310)">
    <rect x="-240" y="-160" width="480" height="320" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="4" opacity="0.95"/>
    <!-- Newspaper Masthead -->
    <rect x="-210" y="-130" width="420" height="28" rx="4" fill="#0f172a"/>
    <text x="0" y="-111" fill="#ffffff" font-family="serif" font-weight="900" font-size="14" letter-spacing="4" text-anchor="middle">MARS NEWS · SPECIAL REPORT</text>

    <!-- Headline Lines -->
    <rect x="-210" y="-80" width="280" height="14" rx="2" fill="#e11d48"/>
    <rect x="-210" y="-55" width="230" height="10" rx="2" fill="#475569"/>

    <!-- Left Column Text Lines -->
    <g fill="#94a3b8">
      <rect x="-210" y="-25" width="190" height="6" rx="2"/>
      <rect x="-210" y="-10" width="190" height="6" rx="2"/>
      <rect x="-210" y="5" width="170" height="6" rx="2"/>
      <rect x="-210" y="20" width="190" height="6" rx="2"/>
      <rect x="-210" y="35" width="180" height="6" rx="2"/>
      <rect x="-210" y="50" width="160" height="6" rx="2"/>
      <rect x="-210" y="65" width="190" height="6" rx="2"/>
      <rect x="-210" y="80" width="140" height="6" rx="2"/>
    </g>

    <!-- Right Image Block -->
    <rect x="0" y="-25" width="210" height="115" rx="6" fill="#1e293b"/>
    <circle cx="105" cy="20" r="24" fill="none" stroke="#e11d48" stroke-width="3"/>
    <polygon points="98,10 118,20 98,30" fill="#e11d48"/>
  </g>

  <!-- Title Badge Overlay -->
  <rect x="50" y="560" width="380" height="68" rx="8" fill="#0f172a" opacity="0.9" stroke="#334155" stroke-width="1.5"/>
  <text x="75" y="590" fill="#fb7185" font-family="sans-serif" font-weight="bold" font-size="12" letter-spacing="2">MARS NEWS · EDITORIAL DESK</text>
  <text x="75" y="612" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="16">Verified Multi-Source Reporting</text>
</svg>
