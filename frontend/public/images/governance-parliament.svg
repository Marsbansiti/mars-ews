<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_gov" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#19152b"/>
      <stop offset="100%" stop-color="#2a1421"/>
    </linearGradient>
    <linearGradient id="flag_saffron" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9933"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="flag_green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#138808"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg_gov)"/>

  <!-- Indian Tricolor Waves Background -->
  <path d="M 0 100 Q 300 160 600 100 T 1200 120 L 1200 170 Q 900 220 600 160 T 0 160 Z" fill="url(#flag_saffron)" opacity="0.25"/>
  <path d="M 0 160 Q 300 220 600 160 T 1200 170 L 1200 220 Q 900 270 600 210 T 0 210 Z" fill="#ffffff" opacity="0.15"/>
  <path d="M 0 210 Q 300 270 600 210 T 1200 220 L 1200 270 Q 900 320 600 260 T 0 260 Z" fill="url(#flag_green)" opacity="0.25"/>

  <!-- Grand Parliament Rotunda Silhouette -->
  <g transform="translate(600, 360)">
    <!-- Base podium -->
    <rect x="-350" y="80" width="700" height="30" rx="4" fill="#334155"/>
    <rect x="-330" y="60" width="660" height="20" fill="#475569"/>

    <!-- Classical Columns -->
    <g fill="#94a3b8">
      <rect x="-300" y="-120" width="16" height="180"/>
      <rect x="-240" y="-120" width="16" height="180"/>
      <rect x="-180" y="-120" width="16" height="180"/>
      <rect x="-120" y="-120" width="16" height="180"/>
      <rect x="-60" y="-120" width="16" height="180"/>
      <rect x="0" y="-120" width="16" height="180"/>
      <rect x="60" y="-120" width="16" height="180"/>
      <rect x="120" y="-120" width="16" height="180"/>
      <rect x="180" y="-120" width="16" height="180"/>
      <rect x="240" y="-120" width="16" height="180"/>
      <rect x="300" y="-120" width="16" height="180"/>
    </g>

    <!-- Entablature & Pediment -->
    <rect x="-330" y="-140" width="660" height="20" fill="#64748b"/>
    <polygon points="-340,-140 0,-220 340,-140" fill="#cbd5e1" opacity="0.9"/>

    <!-- Ashoka Chakra Wheel Emblem -->
    <circle cx="0" cy="-170" r="24" fill="none" stroke="#1e3a8a" stroke-width="3"/>
    <circle cx="0" cy="-170" r="4" fill="#1e3a8a"/>
  </g>

  <!-- Title Badge Overlay -->
  <rect x="50" y="560" width="380" height="68" rx="8" fill="#0f172a" opacity="0.9" stroke="#334155" stroke-width="1.5"/>
  <text x="75" y="590" fill="#f97316" font-family="sans-serif" font-weight="bold" font-size="12" letter-spacing="2">MARS NEWS · NATIONAL &amp; GOVERNANCE</text>
  <text x="75" y="612" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="16">Parliament &amp; Public Policy Bureau</text>
</svg>
