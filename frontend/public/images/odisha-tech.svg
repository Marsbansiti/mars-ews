<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_odisha" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1320"/>
      <stop offset="50%" stop-color="#1e1838"/>
      <stop offset="100%" stop-color="#341324"/>
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg_odisha)"/>

  <!-- Circuit traces -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.35">
    <path d="M 100 200 H 300 L 400 300 H 600"/>
    <circle cx="600" cy="300" r="4" fill="#38bdf8"/>
    <path d="M 200 500 H 350 L 450 400 H 550 V 250"/>
    <circle cx="550" cy="250" r="4" fill="#38bdf8"/>
    <path d="M 800 150 H 950 L 1050 250 H 1150"/>
    <path d="M 750 450 L 850 350 H 1100"/>
  </g>

  <!-- Giant Semiconductor Wafer & Chip (Bhubaneswar Tech Park) -->
  <g transform="translate(600, 310)">
    <!-- Outer Silicon Ring -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="#64748b" stroke-width="4" stroke-dasharray="8,8" opacity="0.4"/>
    <rect x="-110" y="-110" width="220" height="220" rx="16" fill="url(#chip)" stroke="url(#copper)" stroke-width="4"/>

    <!-- Microchip Pins -->
    <g stroke="url(#copper)" stroke-width="4">
      <line x1="-125" y1="-70" x2="-110" y2="-70"/>
      <line x1="-125" y1="-30" x2="-110" y2="-30"/>
      <line x1="-125" y1="10" x2="-110" y2="10"/>
      <line x1="-125" y1="50" x2="-110" y2="50"/>

      <line x1="110" y1="-70" x2="125" y2="-70"/>
      <line x1="110" y1="-30" x2="125" y2="-30"/>
      <line x1="110" y1="10" x2="125" y2="10"/>
      <line x1="110" y1="50" x2="125" y2="50"/>

      <line x1="-70" y1="-125" x2="-70" y2="-110"/>
      <line x1="-30" y1="-125" x2="-30" y2="-110"/>
      <line x1="10" y1="-125" x2="10" y2="-110"/>
      <line x1="50" y1="-125" x2="50" y2="-110"/>

      <line x1="-70" y1="110" x2="-70" y2="125"/>
      <line x1="-30" y1="110" x2="-30" y2="125"/>
      <line x1="10" y1="110" x2="10" y2="125"/>
      <line x1="50" y1="110" x2="50" y2="125"/>
    </g>

    <!-- Core Die & Branding -->
    <rect x="-65" y="-65" width="130" height="130" rx="8" fill="#020617" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="-15" fill="#f8fafc" font-family="sans-serif" font-weight="900" font-size="18" text-anchor="middle">ODISHA</text>
    <text x="0" y="8" fill="#fb923c" font-family="sans-serif" font-weight="bold" font-size="11" letter-spacing="3" text-anchor="middle">SEMICONDUCTOR</text>
    <text x="0" y="30" fill="#38bdf8" font-family="sans-serif" font-weight="semibold" font-size="10" letter-spacing="2" text-anchor="middle">BHUBANESWAR</text>
  </g>

  <!-- Title Badge Overlay -->
  <rect x="50" y="560" width="380" height="68" rx="8" fill="#0f172a" opacity="0.9" stroke="#334155" stroke-width="1.5"/>
  <text x="75" y="590" fill="#f59e0b" font-family="sans-serif" font-weight="bold" font-size="12" letter-spacing="2">MARS NEWS · ODISHA REGIONAL DESK</text>
  <text x="75" y="612" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="16">Semiconductor &amp; AI High-Tech Park</text>
</svg>
