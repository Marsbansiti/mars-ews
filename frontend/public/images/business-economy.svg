<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_biz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f1d38"/>
      <stop offset="100%" stop-color="#162c5b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="glow_cyan" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg_biz)"/>

  <!-- Candlestick & Market Grid -->
  <g opacity="0.15" stroke="#94a3b8" stroke-width="1">
    <line x1="100" y1="120" x2="1100" y2="120"/>
    <line x1="100" y1="220" x2="1100" y2="220"/>
    <line x1="100" y1="320" x2="1100" y2="320"/>
    <line x1="100" y1="420" x2="1100" y2="420"/>
    <line x1="100" y1="520" x2="1100" y2="520"/>
  </g>

  <!-- Financial Candlesticks -->
  <g opacity="0.6">
    <line x1="180" y1="280" x2="180" y2="420" stroke="#10b981" stroke-width="2"/>
    <rect x="172" y="310" width="16" height="80" rx="2" fill="#10b981"/>

    <line x1="240" y1="260" x2="240" y2="390" stroke="#10b981" stroke-width="2"/>
    <rect x="232" y="280" width="16" height="70" rx="2" fill="#10b981"/>

    <line x1="300" y1="300" x2="300" y2="440" stroke="#ef4444" stroke-width="2"/>
    <rect x="292" y="320" width="16" height="90" rx="2" fill="#ef4444"/>

    <line x1="360" y1="240" x2="360" y2="380" stroke="#10b981" stroke-width="2"/>
    <rect x="352" y="260" width="16" height="80" rx="2" fill="#10b981"/>

    <line x1="420" y1="200" x2="420" y2="340" stroke="#10b981" stroke-width="2"/>
    <rect x="412" y="220" width="16" height="90" rx="2" fill="#10b981"/>
  </g>

  <!-- Exponential Growth Curve -->
  <path d="M 120 480 Q 500 460 700 280 T 1100 140" fill="none" stroke="#10b981" stroke-width="4"/>
  <path d="M 120 480 Q 500 460 700 280 T 1100 140 L 1100 560 L 120 560 Z" fill="url(#glow_cyan)"/>

  <!-- Giant Digital Rupee Medallion (RBI / Central Bank) -->
  <g transform="translate(850, 320)">
    <circle cx="0" cy="0" r="140" fill="#0f172a" stroke="url(#gold)" stroke-width="8"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#ca8a04" stroke-width="2" stroke-dasharray="8,6"/>
    <!-- Indian Rupee Symbol (₹) -->
    <text x="0" y="48" fill="url(#gold)" font-family="serif" font-weight="900" font-size="140" text-anchor="middle">₹</text>
    <text x="0" y="95" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="13" letter-spacing="4" text-anchor="middle">DIGITAL RUPEE</text>
  </g>

  <!-- Title Badge Overlay -->
  <rect x="50" y="560" width="380" height="68" rx="8" fill="#0f172a" opacity="0.9" stroke="#334155" stroke-width="1.5"/>
  <text x="75" y="590" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="12" letter-spacing="2">MARS NEWS · BUSINESS &amp; MARKETS</text>
  <text x="75" y="612" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="16">Reserve Bank of India &amp; Economy</text>
</svg>
